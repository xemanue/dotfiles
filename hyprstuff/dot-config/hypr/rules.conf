# █▀█ █ █ █   █▀▀ █▀ #
# █▀▄ █▄█ █▄▄ ██▄ ▄█ #

# Windows opened on the special workspace
windowrule = match:workspace s[1], float 1
windowrule = match:workspace s[1], size 800 600
windowrule = match:workspace s[1], center 1

# Polkit windows
windowrule = match:class xfce-polkit, float 1

# Thunar rename
windowrule = match:initial_title Rename .*, float 1
windowrule = match:initial_title Rename .*, size 360 120
windowrule = match:initial_title Rename .*, center 1

# Pavucontrol windows
windowrule = match:class org.pulseaudio.pavucontrol, float 1
windowrule = match:class org.pulseaudio.pavucontrol, size 800 600
windowrule = match:class org.pulseaudio.pavucontrol, center 1

# Picture in picture videos
windowrule = match:initial_title Picture in picture, float 1
windowrule = match:initial_title Picture in picture, size 426 240
windowrule = match:initial_title Picture in picture, move 1486 832
windowrule = match:initial_title Picture in picture, pin 1

# Steam windows
windowrule = match:initial_class steam, tag +steam
windowrule = match:initial_title Steam, tag -steam
windowrule = match:initial_title (), tag -steam
windowrule = match:tag steam, float 1
windowrule = match:initial_title Friends List, size 800 600
windowrule = match:tag steam, center 1

# Prism launcher windows
windowrule = match:initial_class org.prismlauncher.PrismLauncher, tag +prism
windowrule = match:initial_title ^(Prism Launcher).*, tag -prism
windowrule = match:tag prism, float 1
windowrule = match:tag prism, size 800 600
windowrule = match:tag prism, center 1

# Calculator
windowrule = match:initial_class org.gnome.Calculator, float 1
windowrule = match:initial_class org.gnome.Calculator, size 360 616
windowrule = match:initial_class org.gnome.Calculator, pin 1

# Fullscreen windows avoid hypridle
windowrule = match:class .*, idle_inhibit fullscreen
