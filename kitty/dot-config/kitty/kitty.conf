# BEGIN_KITTY_THEME
include themes/x-mfd.conf
# END_KITTY_THEME


# Font settings
font_size               13.0
font_family             Iosevkust NFM
bold_font               Iosevkust NFM
italic_font             Iosevkust NFM
bold_italic_font        Iosevkust NFM

# Cursor settings
cursor_shape            block
cursor_blink_interval   0
cursor_trail            1
cursor_trail_decay      0.12 0.12
cursor_trail_start_threshold 0

# Mouse settings
mouse_hide_wait         0

# Bell settings
enable_audio_bell       no

# Window settings
window_padding_width    12 12

# Tabs
tab_bar_min_tabs        1
tab_bar_edge            bottom
tab_bar_style           fade
tab_fade                0
tab_bar_align           left
tab_title_template      "{index}"

active_tab_font_style normal

# Ligatures
disable_ligatures       always

# Shell overrides cursor shape
shell_integration       no-cursor

# No exit confirmations
confirm_os_window_close 0

# Bind ctrl+backspace to delete whole word
map ctrl+backspace send_text all \x17
